<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leining Log</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='6' y='9' width='6' height='30' rx='3' fill='%23b8892b'/%3E%3Ccircle cx='9' cy='9' r='4.5' fill='%23b8892b'/%3E%3Ccircle cx='9' cy='39' r='4.5' fill='%23b8892b'/%3E%3Crect x='36' y='9' width='6' height='30' rx='3' fill='%23b8892b'/%3E%3Ccircle cx='39' cy='9' r='4.5' fill='%23b8892b'/%3E%3Ccircle cx='39' cy='39' r='4.5' fill='%23b8892b'/%3E%3Crect x='13' y='11' width='22' height='26' rx='1.5' fill='%23f6f5f1' stroke='%232f4870' stroke-width='1.6'/%3E%3Cline x1='17' y1='17' x2='31' y2='17' stroke='%232f4870' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='17' y1='21.5' x2='31' y2='21.5' stroke='%232f4870' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='17' y1='26' x2='31' y2='26' stroke='%232f4870' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='17' y1='30.5' x2='27' y2='30.5' stroke='%232f4870' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="#home">
        <svg class="brand-mark" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true">
          <rect x="6" y="9" width="6" height="30" rx="3" fill="var(--accent-2)" />
          <circle cx="9" cy="9" r="4.5" fill="var(--accent-2)" />
          <circle cx="9" cy="39" r="4.5" fill="var(--accent-2)" />
          <rect x="36" y="9" width="6" height="30" rx="3" fill="var(--accent-2)" />
          <circle cx="39" cy="9" r="4.5" fill="var(--accent-2)" />
          <circle cx="39" cy="39" r="4.5" fill="var(--accent-2)" />
          <rect x="13" y="11" width="22" height="26" rx="1.5" fill="var(--bg-elevated)" stroke="var(--accent)" stroke-width="1.6" />
          <line x1="17" y1="17" x2="31" y2="17" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
          <line x1="17" y1="21.5" x2="31" y2="21.5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
          <line x1="17" y1="26" x2="31" y2="26" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
          <line x1="17" y1="30.5" x2="27" y2="30.5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
        </svg>
        <span class="brand-name">Leining Log</span>
      </a>
      <nav id="tabs" class="tabs"></nav>
      <button id="theme-toggle" class="theme-toggle" title="Toggle light/dark" aria-label="Toggle light/dark">◐</button>
    </div>
  </header>
  <p class="site-tagline">Look up any parsha or holiday reading, see how hard it is to leyn and why, and keep track of what you've read.</p>
  <div id="account-banner" class="account-banner"></div>
  <main id="view" class="view-container"></main>
  <footer class="site-footer">
    <p>Difficulty ratings are an estimate, not a guarantee — see <a href="#howitworks">How It Works</a> for the full picture.</p>
  </footer>
  <script type="module" src="js/app.js"></script>
  <script>
    const stored = localStorage.getItem('leining-theme');
    if (stored) document.documentElement.setAttribute('data-theme', stored);
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('leining-theme', next);
    });
  </script>
</body>
</html>
